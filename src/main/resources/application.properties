spring.application.name=${USER_SERVICE_NAME:user-service}

#server.port=${USER_SERVICE_PORT:8080}

server.port=${PORT:8090}

server.address=0.0.0.0

spring.profiles.active=dev

eureka.instance.hostname=elearn-user-service.onrender.com

eureka.instance.non-secure-port-enabled=false

eureka.instance.secure-port-enabled=true

eureka.instance.status-page-url=https://elearn-user-service.onrender.com/actuator/info

eureka.instance.health-check-url=https://elearn-user-service.onrender.com/actuator/health

eureka.instance.home-page-url=https://elearn-user-service.onrender.com

management.endpoints.web.base-path=/actuator

management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always